# Firebase App Hosting configuration.
# Create the App Hosting backend with repository root set to this web/ directory.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://doujin-info.jp"
    availability:
      - BUILD
      - RUNTIME
  - variable: CONTACT_FORM_URL
    value: "https://forms.gle/MPH9jyVfsaiaNsc97"
    availability:
      - BUILD
      - RUNTIME
  - variable: LIST_VIEW_MODE
    value: "prefer"
    availability:
      - RUNTIME
  - variable: LIST_VIEW_DEBUG
    value: "false"
    availability:
      - RUNTIME
  # Compact search stays opt-in. Change to compact only after its batch data is
  # generated and parity-checked; legacy is the immediate read-side rollback.
  - variable: SEARCH_INDEX_READ_MODE
    value: "legacy"
    availability:
      - RUNTIME
  # metricYears migration and point-by-point production verification completed.
  # Set this back to legacy for an immediate read-side rollback.
  - variable: METRIC_HISTORY_READ_MODE
    value: "year"
    availability:
      - RUNTIME
  - variable: METRIC_HISTORY_DEBUG
    value: "false"
    availability:
      - RUNTIME
