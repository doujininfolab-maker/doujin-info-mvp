# Firebase App Hosting configuration.
# Create the App Hosting backend with repository root set to this web/ directory.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_IN_APP_HOSTING_SETTINGS"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://doujin-info.jp"
    availability:
      - BUILD
      - RUNTIME
  - variable: CONTACT_FORM_URL
    value: "https://forms.gle/MPH9jyVfsaiaNsc97"
    availability:
      - BUILD
      - RUNTIME
  - variable: LIST_VIEW_MODE
    value: "prefer"
    availability:
      - RUNTIME
  - variable: LIST_VIEW_DEBUG
    value: "false"
    availability:
      - RUNTIME
  # Production compact index was generated and verified against all 15,245
  # active legacy items. Invalid compact data automatically falls back to legacy.
  - variable: SEARCH_INDEX_READ_MODE
    value: "compact"
    availability:
      - RUNTIME
  # Seller detail reads the precomputed per-seller stats generated by the
  # rebuild job. Set back to legacy for an immediate read-side rollback.
  - variable: SELLER_DETAIL_READ_MODE
    value: "stats"
    availability:
      - RUNTIME
  # metricYears migration and point-by-point production verification completed.
  # After year-only writes begin, legacy reads require backfilling the gap.
  - variable: METRIC_HISTORY_READ_MODE
    value: "year"
    availability:
      - RUNTIME
  - variable: METRIC_HISTORY_DEBUG
    value: "false"
    availability:
      - RUNTIME
  # Production writers and all 406 initial genre views were verified.
  - variable: GENRE_DETAIL_READ_MODE
    value: "prefer"
    availability:
      - RUNTIME
